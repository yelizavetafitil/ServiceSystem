{% extends "base.html" %}
{% block title %}База знаний{% endblock %}
{% block content %}
<div class="container">
  <div class="page-header">
    <h1>База знаний</h1>
    <form class="search-bar" method="get">
      <input type="search" name="q" value="{{ search }}" placeholder="Полнотекстовый поиск..." class="form-control">
      <button class="btn btn-primary">Найти</button>
    </form>
  </div>
  <div class="kb-list">
    {% for t in tutorials %}
    <a href="{{ url_for('cabinet.tutorial_detail', slug=t.slug) }}" class="kb-item">
      <span class="kb-cat">{{ t.category }}</span>
      <h3>{{ t.title }}</h3>
      <span class="kb-tags">{{ t.tags }}</span>
    </a>
    {% else %}
    <p class="muted">Материалы не найдены.</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
