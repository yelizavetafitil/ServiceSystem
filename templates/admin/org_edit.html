{% extends "base.html" %}
{% from "macros/forms.html" import csrf_field %}
{% block title %}Организация — {{ org.name }}{% endblock %}
{% block content %}
<div class="container container-form">
  <a href="{{ url_for('admin.contracts') }}" class="back-link">← Договоры</a>
  <div class="card">
    <h1 class="section-title">Редактирование организации</h1>
    <form method="post">
      {{ csrf_field() }}
      <div class="form-group">
        <label>Название *</label>
        <input name="name" class="form-control" required value="{{ org.name }}" placeholder="РУП «…»">
      </div>
      <div class="form-group">
        <label>Код (short_name)</label>
        <input name="short_name" class="form-control" value="{{ org.short_name or '' }}" placeholder="brest">
        <p class="hint">Краткий идентификатор для системы; необязательно.</p>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{{ url_for('admin.contracts') }}" class="btn btn-outline">Отмена</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
