{% extends "base.html" %}
{% from "macros/forms.html" import csrf_field %}
{% block title %}Пользователь {{ user.full_name }}{% endblock %}
{% block content %}
<div class="container container-form">
  <a href="{{ url_for('admin.users') }}" class="back-link">← Пользователи</a>
  <div class="card">
    <h2>{{ user.full_name }}</h2>
    <form method="post">
      {{ csrf_field() }}
      <div class="form-group"><label>ФИО</label><input name="full_name" class="form-control" value="{{ user.full_name }}" required></div>
      <div class="form-group"><label>Email</label><input class="form-control" value="{{ user.email }}" disabled></div>
      <div class="form-group"><label>Должность</label><input name="position" class="form-control" value="{{ user.position or '' }}"></div>
      <div class="form-group"><label>Роль</label>
        <select name="role" class="form-control">
          {% for k,v in ROLES.items() %}
          <option value="{{ k }}" {% if user.role == k %}selected{% endif %}>{{ v }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group"><label>Новый пароль (оставьте пустым, чтобы не менять)</label><input type="password" name="password" class="form-control"></div>
      <label class="check-row"><input type="checkbox" name="is_active" value="1" {% if user.is_active %}checked{% endif %}> Активен</label>
      <div class="form-actions">
        <button class="btn btn-primary">Сохранить</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
