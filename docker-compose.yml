# Система гарантийного и постгарантийного обслуживания ЭМСТПН
# http://localhost:8095

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: servicesystem
      POSTGRES_PASSWORD: servicesystem
      POSTGRES_DB: servicesystem
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ssnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicesystem -d servicesystem"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8095}:5000"
    environment:
      DATABASE_URL: postgresql+psycopg2://servicesystem:servicesystem@db:5432/servicesystem
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-servicesystem}
      UPLOAD_FOLDER: /app/data/uploads
      APP_NAME: "Сервис ЭМСТПН"
      ORG_NAME: 'РУП «Белнипиэнергопром»'
      FORCE_HTTPS: ${FORCE_HTTPS:-0}
      MAIL_ENABLED: ${MAIL_ENABLED:-0}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
    volumes:
      - upload_data:/app/data/uploads
      # Код с хоста: правки templates/static/python без пересборки образа (docker compose restart web)
      - ./servicesystem:/app/servicesystem:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
      - ./wsgi.py:/app/wsgi.py:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ssnet

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: servicesystem
      POSTGRES_PASSWORD: servicesystem
      POSTGRES_DB: servicesystem
      BACKUP_DIR: /app/data/backups
    volumes:
      - upload_data:/app/data/uploads
      - backup_data:/app/data/backups
      - ./scripts/backup.sh:/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ssnet
    entrypoint: ["/bin/sh", "-c", "chmod +x /backup.sh && while true; do /backup.sh; sleep 2592000; done"]

  seed:
    build: .
    profiles: ["seed"]
    environment:
      DATABASE_URL: postgresql+psycopg2://servicesystem:servicesystem@db:5432/servicesystem
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-servicesystem}
      UPLOAD_FOLDER: /app/data/uploads
    volumes:
      - upload_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ssnet
    command: ["python", "seed.py"]

networks:
  ssnet:
    driver: bridge

volumes:
  pg_data:
  upload_data:
  backup_data:
